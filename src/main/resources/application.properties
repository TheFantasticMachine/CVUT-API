spring.application.name=rest-api
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# Fixed JDBC URL: added "://", enabled SSL, and allowed public key retrieval
spring.datasource.url=jdbc:mysql://localhost:3306/CVUT-ver-2
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keeps the connection pool alive across cloud networks
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000

# Hibernate Table Strategy
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

management.endpoints.web.exposure.include=shutdown
management.endpoint.shutdown.enabled=true