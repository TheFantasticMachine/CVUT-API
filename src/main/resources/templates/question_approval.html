<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Moderation & Approval - TestGen</title>
  <link rel="stylesheet" th:href="@{/dist/question_approval.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="approval-page">

<!-- Top Navigation Bar -->
<header class="approval-navbar">
  <div class="nav-brand">
    <a th:href="@{/main}" class="btn-back" title="Back to Dashboard">
      <i class="fa-solid fa-arrow-left"></i>
    </a>
    <div class="brand-info">
      <h1>Question Approval Hub</h1>
      <span class="hub-subtitle">Review, edit, and moderate curriculum questions</span>
    </div>
  </div>

  <div class="nav-actions">
    <div class="user-chip">
      <i class="fa-solid fa-user-shield"></i>
      <span th:text="${session.currentUser != null ? session.currentUser.username : 'Admin'}">Admin</span>
    </div>
  </div>
</header>

<main class="approval-layout">
  <!-- Filter & Control Toolbar -->
  <section class="toolbar-section">
    <div class="status-filters" role="tablist">
      <button type="button" class="filter-tab active" data-status="PENDING">
        <i class="fa-solid fa-clock"></i>
        <span>Pending Review</span>
        <span class="counter-badge" id="badge-pending">0</span>
      </button>
      <button type="button" class="filter-tab" data-status="APPROVED">
        <i class="fa-solid fa-circle-check"></i>
        <span>Approved</span>
        <span class="counter-badge neutral" id="badge-approved">0</span>
      </button>
      <button type="button" class="filter-tab" data-status="REJECTED">
        <i class="fa-solid fa-circle-xmark"></i>
        <span>Rejected / Needs Revision</span>
        <span class="counter-badge neutral" id="badge-rejected">0</span>
      </button>
    </div>

    <div class="search-sort-box">
      <div class="search-input-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="approval-search-input" placeholder="Search assignment or author...">
      </div>
    </div>
  </section>

  <!-- Question Stream Container -->
  <section id="approval-list-container" class="approval-list">
    <!-- Dynamic JavaScript insertion / Empty state fallback -->
    <div class="loading-state">
      <i class="fa-solid fa-circle-notch fa-spin"></i>
      <p>Loading questions for review...</p>
    </div>
  </section>
</main>

<!-- Reject / Request Edits Modal Dialog -->
<dialog id="feedback-dialog" class="feedback-modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title-group">
        <div class="icon-bubble warning">
          <i class="fa-solid fa-comment-dots"></i>
        </div>
        <div>
          <h2>Request Question Edits</h2>
          <p class="modal-subtitle">Explain what the teacher should fix before approval.</p>
        </div>
      </div>
      <button type="button" class="btn-close-modal" id="btn-close-dialog">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form id="feedback-form">
      <input type="hidden" id="feedback-question-id">

      <div class="input-group">
        <label for="feedback-message">Feedback / Changes Needed</label>
        <textarea id="feedback-message" rows="4" placeholder="e.g. Option C is ambiguous. Please ensure all resistance values have proper Ohm units." required></textarea>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="btn-cancel-feedback">Cancel</button>
        <button type="submit" class="btn-warning" id="btn-confirm-feedback">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Send Feedback</span>
        </button>
      </div>
    </form>
  </div>
</dialog>

<script th:src="@{/dist/question_approval.js}"></script>
</body>
</html>
