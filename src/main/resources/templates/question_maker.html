<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tvorba otázek</title>
    <link rel="stylesheet" th:href="@{dist/question_style.css}">
</head>
<body>

<div class="question-maker-container">
    <div class="card-header">
        <h2>Vytvořit otázku</h2>
        <p class="subtitle">Vyplňte zadání otázky, možnosti odpovědí a metadata níže.</p>
    </div>

    <form id="question-form" class="question-form">

        <!-- 1. Question Assignment -->
        <div class="form-group">
            <label for="assignment">Zadání otázky</label>
            <textarea id="assignment" name="assignment" rows="3"
                      placeholder="např. Který protokol pracuje na transportní vrstvě modelu ISO/OSI?" required></textarea>
        </div>

        <!-- 2. Category Selection (From Globals) -->
        <div class="form-group">
            <label for="categoryID">Kategorie</label>
            <select id="categoryID" name="categoryID" required>
                <option value="" disabled selected>-- Vyberte kategorii --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.categoryID}"
                        th:text="${cat.categoryName}">
                    Sítě
                </option>
            </select>
        </div>

        <!-- 3. Difficulty Slider (1 to 10) -->
        <div class="form-group">
            <div class="label-row">
                <label for="difficulty">Úroveň obtížnosti</label>
                <span id="difficulty-val" class="slider-badge">5</span>
            </div>
            <div class="slider-wrapper">
                <span class="range-min">1</span>
                <input type="range" id="difficulty" name="difficulty"
                       min="1" max="10" value="5" class="difficulty-slider"
                       oninput="document.getElementById('difficulty-val').innerText = this.value" />
                <span class="range-max">10</span>
            </div>
        </div>

        <!-- 4. Question Answers List -->
        <div class="answers-section">
            <div class="answers-header">
                <label>Možnosti odpovědí</label>
                <span class="hint">Označte přepínač u správné odpovědi.</span>
            </div>

            <div id="answers-list" class="answers-list">
            </div>

            <!-- Add Answer Button -->
            <button type="button" id="add-answer-btn" class="btn-secondary">+ Přidat možnost</button>
        </div>

        <!-- 5. Form Submission Buttons -->
        <div class="form-actions">
            <button type="submit" class="btn-primary">Uložit otázku</button>
        </div>

    </form>
</div>

<script th:src="@{dist/question_maker_effects.js}"></script>
<script type="module" th:src="@{dist/send_question.js}"></script>

</body>
</html>
