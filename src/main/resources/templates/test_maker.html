<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tvorba testu - TestGen</title>
    <link rel="stylesheet" th:href="@{/dist/test_maker.css}">
    <link rel="stylesheet" th:href="@{/dist/pdf-template.css}">
    <link rel="stylesheet" th:href="@{/dist/test_maker_modals.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>

<dialog id="question-popup-wrapper">
    <div class="excluded">
        <div class="heading">
            <i class="fa-solid fa-circle-plus"></i>
            <h2>Přidat otázku</h2>
        </div>
        <form action="" class="search-form">
            <span class="subject"></span>
            <select id="pool-category-filter" class="add-question-category"></select>
            <input id="pool-search-input" type="text" name="search" placeholder="Hledat otázku..." />
        </form>

        <div class="content" id="add-question-popup-content">
            <div class="question-pool-card" data-question-id="1">
                <button type="button" class="btn-add-circle" title="Přidat do aktuální varianty">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <div class="card-body">
                    <p class="question-assignment">
                        Jaký je vzorec pro objem koule o poloměru r?
                    </p>

                    <div class="card-footer-meta">
                        <span class="meta-tag category-tag">Geometrie</span>
                        <span class="meta-tag difficulty-tag">Obtížnost: 3/5</span>

                        <div class="variant-indicators" title="Použití ve variantách">
                            <span class="v-dot active">A</span>
                            <span class="v-dot">B</span>
                            <span class="v-dot">C</span>
                        </div>

                        <button type="button" class="btn-toggle-answers">
                            <span>Zobrazit možnosti</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                    </div>

                    <div class="preview-answers-drawer">
                        <div class="answer-row correct">
                            <span class="option-label">A)</span>
                            <span class="option-text">(4/3) * &pi; * r&sup3;</span>
                            <i class="fa-solid fa-check check-icon"></i>
                        </div>
                        <div class="answer-row">
                            <span class="option-label">B)</span>
                            <span class="option-text">4 * &pi; * r&sup2;</span>
                        </div>
                        <div class="answer-row">
                            <span class="option-label">C)</span>
                            <span class="option-text">&pi; * r&sup2;</span>
                        </div>
                        <div class="answer-row">
                            <span class="option-label">D)</span>
                            <span class="option-text">2 * &pi; * r</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</dialog>

<div class="test-maker-container">

    <!-- Left Sidebar: Navigation & Builder Tools -->
    <aside class="sidebar-tools">

        <div class="sidebar-header">
            <a th:href="@{/main2}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Zpět</a>
        </div>

        <div class="tool-group">
            <span class="tool-group-label">Nástroje</span>
            <button class="tool-btn" id="btn-add" title="Přidat otázku z banky">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Přidat otázku</span>
            </button>
            <button class="tool-btn" id="btn-export-answers" title="Exportovat PDF se správnými odpověďmi pro tuto variantu">
                <i class="fa-solid fa-file-circle-check"></i>
                <span>Export Odpovědí</span>
            </button>
            <button style="color: #F36E51;" class="tool-btn" id="btn-delete-variant" title="Smazat tuto variantu">
                <i style="color: #F36E51" class="fa-solid fa-trash"></i>
                <span>Smazat variantu</span>
            </button>
        </div>

        <div class="tool-group bottom-actions">
            <button class="action-btn save-btn" id="btn-save">
                <i class="fa-solid fa-floppy-disk"></i> Uložit návrh
            </button>
            <button class="action-btn export-btn" id="btn-export-pdf">
                <i class="fa-solid fa-file-pdf"></i> Exportovat PDF
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="test-workspace">

        <!-- Top Header: Test Name & Subject Selector -->
        <header class="workspace-top-bar">
            <div class="test-identity-display">
                <h1 class="display-test-name" id="display-test-name">Architektura počítačů – Test 1</h1>
                <span class="display-subject-tag" id="display-subject-tag">Operační systémy</span>
            </div>
        </header>

        <!-- Sub-Header: Dark Ribbon with Variant Switcher Tabs -->
        <nav class="variant-ribbon">
            <div class="variant-tabs" id="variant-tab-container">
                <button class="add-variant-btn" id="add-variant-btn" title="Přidat variantu">+</button>
            </div>
        </nav>

        <!-- Preview Canvas Area -->
        <section class="test-preview-canvas" id="preview-canvas">
            <div class="a4-sheet" id="a4-preview-sheet">
            </div>
        </section>

    </main>

</div>

<script defer th:src="@{/dist/send_test.js}"></script>
<script defer th:src="@{/dist/question_manager.js}"></script>
<script defer th:src="@{/dist/question_pool_modal.js}"></script>
<script defer th:src="@{/dist/test_maker_settings_modal.js}"></script>

</body>
</html>
