<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Maker - Generator</title>
    <link rel="stylesheet" th:href="@{/dist/test_maker.css}">
    <link rel="stylesheet" th:href="@{dist/pdf-template.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">

</head>
<body>

<dialog id="question-popup-wrapper">
    <div class="excluded">
        <div class="heading">
            <i class="fa-solid fa-circle-plus"></i>
            <h2>Add question</h2>
        </div>
        <form action="" class="search-form">
            <span class="subject"></span>
            <select class="add-question-category"></select>
            <!-- later add search and sort and difficulty -->
        </form>

        <div id="add-question-error" class="default-error">
            <i class="fa-solid fa-school-circle-exclamation"></i>
            <span>Please select the subject of the test before picking a question</span>
        </div>

        <div class="content" id="add-question-popup-content">
            <div class="question-pool-card" data-question-id="1">
                <!-- Big Circle Add Button -->
                <button type="button" class="btn-add-circle" title="Add to current variant">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <!-- Content & Controls Area -->
                <div class="card-body">
                    <!-- Top Row: Assignment Text -->
                    <p class="question-assignment">
                        What is the volume formula for a perfect sphere with radius r?
                    </p>

                    <!-- Bottom Row: Metadata & Expand Action -->
                    <div class="card-footer-meta">
                        <span class="meta-tag category-tag">Geometry</span>
                        <span class="meta-tag difficulty-tag">Diff: 3/5</span>

                        <!-- Variant Usage Badges (Lit up if used in that variant) -->
                        <div class="variant-indicators" title="Usage in variants">
                            <span class="v-dot active">A</span>
                            <span class="v-dot">B</span>
                            <span class="v-dot">C</span>
                        </div>

                        <!-- Preview Toggle Button -->
                        <button type="button" class="btn-toggle-answers">
                            <span>View Options</span>
                            <i class="fa-solid fa-chevron-down"></i>
                        </button>
                    </div>

                    <!-- Collapsible Answer List (Matches the Question UI on the test) -->
                    <div class="preview-answers-drawer">
                        <div class="answer-row correct">
                            <span class="option-label">A)</span>
                            <span class="option-text">(4/3) * &pi; * r&sup3;</span>
                            <i class="fa-solid fa-check check-icon"></i>
                        </div>
                        <div class="answer-row">
                            <span class="option-label">B)</span>
                            <span class="option-text">4 * &pi; * r&sup2;</span>
                        </div>
                        <div class="answer-row">
                            <span class="option-label">C)</span>
                            <span class="option-text">&pi; * r&sup2;</span>
                        </div>
                        <div class="answer-row">
                            <span class="option-label">D)</span>
                            <span class="option-text">2 * &pi; * r</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</dialog>

<div class="test-maker-container">

    <!-- Left Sidebar: Navigation & Builder Tools -->
    <aside class="sidebar-tools">

        <div class="sidebar-header">
            <a th:href="@{/}" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </div>

        <div class="tool-group">
            <span class="tool-group-label">Tools</span>
            <button class="tool-btn" id="btn-pool" title="Browse Question Pool">
                <i class="fa-solid fa-list-check"></i>
                <span>Question Pool</span>
            </button>
            <button class="tool-btn" id="btn-add" title="Add Question to the Pool">
                <i class="fa-solid fa-circle-plus"></i>
                <span>Add Question</span>
            </button>
            <button class="tool-btn" id="btn-shuffle" title="Shuffle Questions & Answers">
                <i class="fa-solid fa-shuffle"></i>
                <span>Shuffle Orders</span>
            </button>
            <button class="tool-btn" id="btn-settings" title="Test Settings & Points">
                <i class="fa-solid fa-sliders"></i>
                <span>Settings</span>
            </button>
        </div>

        <div class="tool-group bottom-actions">
            <button class="action-btn save-btn" id="btn-save">
                <i class="fa-solid fa-floppy-disk"></i> Save Draft
            </button>
            <button class="action-btn export-btn" id="btn-export-pdf">
                <i class="fa-solid fa-file-pdf"></i> Export PDF
            </button>
        </div>
    </aside>

    <!-- Main Workspace -->
    <main class="test-workspace">

        <!-- Top Header: Test Name & Subject Selector -->
        <header class="workspace-top-bar">
            <div class="input-field-wrapper title-wrapper">
                <input type="text" id="test-name" placeholder="Test Name (e.g., Computer Architecture Exam 1)" required />
            </div>
            <div class="input-field-wrapper subject-wrapper">
                <select onchange="getTestSubject(this)" id="test-subject">
                    <option value="" disabled selected>Select Subject...</option>
                    <option value="1" th:each="sub : ${subjects}" th:text="${sub}"></option>
                </select>
            </div>
        </header>

        <!-- Sub-Header: Dark Ribbon with Variant Switcher Tabs -->
        <nav class="variant-ribbon">
            <div class="variant-tabs" id="variant-tab-container">
                <button class="add-variant-btn" id="add-variant-btn" title="Add Variant">+</button>
            </div>
        </nav>

        <!-- Preview Canvas Area -->
        <section class="test-preview-canvas" id="preview-canvas">
            <div class="a4-sheet" id="a4-preview-sheet">
                <!-- Test Header Preview -->
                <header>
                    <span class="header-test-variant">Variant</span>
                    <hr>
                    <div class="header-row-one">
                        <span class="header-test-subject">Subject</span>
                        <span class="header-test-date">Date: </span>
                    </div>
                    <span class="header-name">Name: </span>
                    <hr>
                </header>
                <hr class="preview-divider" />

                <!-- Dynamic Question List in Active Variant -->
                <div class="preview-questions-list" id="preview-questions-list">

                    <div class="question">
                        <div id="flex-row-one">
                            <input type="text" class="assignment" placeholder="Lorem ipsum dolor sit amet, consectetur adipisicing elit. Blanditiis facilis fugit impedit laudantium libero maiores molestias, mollitia quidem voluptate voluptatibus!" />
                            <button class="remove" title="remove">
                            </button>
                        </div>
                        <div id="flex-row-two">
                            <div class="answer">
                                <span class="letter">A)</span>
                                <input type="text" placeholder="Lorem ipsum dolor sit amet.">
                                <i class="fa-solid fa-grip-lines"></i>
                            </div>

                            <div class="answer correct">
                                <span class="letter">B)</span>
                                <input class="correct" type="text" placeholder="Lorem ipsum dolor sit amet.">
                                <i class="correct fa-solid fa-grip-lines"></i>
                            </div>

                            <div class="answer">
                                <span class="letter">C)</span>
                                <input type="text" placeholder="Lorem ipsum dolor sit amet.">
                                <i class="fa-solid fa-grip-lines"></i>
                            </div>

                            <div class="answer">
                                <span class="letter">D)</span>
                                <input type="text" placeholder="Lorem ipsum dolor sit amet.">
                                <i class="fa-solid fa-grip-lines"></i>
                            </div>
                        </div>
                        <button class="change">Change</button>
                    </div>

<!--                    <div class="empty-state-notice">-->
<!--                        <i class="fa-regular fa-file-lines"></i>-->
<!--                        <p>No questions added to this variant yet. Use the question pool or auto-generator to add questions.</p>-->
<!--                    </div>-->
                </div>
            </div>
        </section>

    </main>

</div>

<!--<script defer th:src="@{/dist/question_fetch.js}"></script>-->
<script defer th:src="@{/dist/preview_manager.js}"></script>
<script defer th:src="@{/dist/send_test.js}"></script>
<script defer th:src="@{/dist/question_manager.js}"></script>

</body>
</html>
