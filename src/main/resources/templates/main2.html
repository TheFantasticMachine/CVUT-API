<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <link rel="stylesheet" th:href="@{dist/main-ver2.css}">
    <script src="https://kit.fontawesome.com/636db4ca92.js" crossorigin="anonymous"></script>
</head>
<body>

<aside>

    <div id="user-profile-wrapper">

        <div class="user-icon-wrapper">
            <i class="fa-solid fa-user"></i>
        </div>

        <span id="username">username</span>
    </div>

    <div id="action-menu-wrapper"></div>

</aside>

<main>

    <div class="in-progress-section">
        <div class="section-header">
            <h3>Tests in Progress</h3>
            <div class="header-actions">
                <button class="btn-icon" title="New Test Draft">+</button>
                <button class="btn-icon" title="View All">&rarr;</button>
            </div>
        </div>

        <!-- Folder Grid -->
        <div class="folder-grid">

            <!-- Folder 1 -->
            <div class="folder-card">
                <div class="folder-header">
                    <span class="folder-title">Networking Test A</span>
                    <button class="menu-btn" title="Options">&#8942;</button>
                </div>
                <div class="folder-body">
                    <span class="question-count">12 / 20 Questions</span>
                    <span class="status-badge draft">Draft</span>
                </div>
            </div>

            <!-- Folder 2 -->
            <div class="folder-card">
                <div class="folder-header">
                    <span class="folder-title">OS Security Midterm</span>
                    <button class="menu-btn" title="Options">&#8942;</button>
                </div>
                <div class="folder-body">
                    <span class="question-count">5 / 15 Questions</span>
                    <span class="status-badge active">In Review</span>
                </div>
            </div>

            <!-- Folder 3 -->
            <div class="folder-card">
                <div class="folder-header">
                    <span class="folder-title">Java Basics Quiz</span>
                    <button class="menu-btn" title="Options">&#8942;</button>
                </div>
                <div class="folder-body">
                    <span class="question-count">18 / 20 Questions</span>
                    <span class="status-badge draft">Draft</span>
                </div>
            </div>

        </div>
    </div>

    <div id="question-wrapper">

        <div id="question-upper">
            <span class="header">Otazky</span>

            <button id="new-question-button"> + </button>
        </div>

        <div id="all-subjects-wrapper">

            <div class="subject-wrapper">

                <div class="subject-showcase">
                    <div class="subject-icon"></div>
                    <span class="subject-name">subject name</span>
                </div>

                <div class="subject-children">

                    <div class="category-wrapper">
                        <div class="category-icon"></div>
                        <span class="category-name">category name</span>
                    </div>

                    <div class="category-wrapper">
                        <div class="category-icon"></div>
                        <span class="category-name">category name</span>
                    </div>

                    <div class="category-wrapper">
                        <div class="category-icon"></div>
                        <span class="category-name">category name</span>
                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

</body>
</html>
