<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přehled - Generátor testů</title>
    <link rel="stylesheet" th:href="@{/dist/main2.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="dashboard-body">

<!-- Top Navigation Header -->
<header class="dashboard-navbar">
    <div class="nav-brand">
<!--        <i class="fa-solid fa-graduation-cap brand-icon"></i>-->
        <img th:src="@{/dist/icon.png}" class="brand-icon" alt="logo">
        <span class="brand-name">TestGen</span>
    </div>
    <div class="nav-user-profile">
        <div class="user-meta">
            <span class="user-name">Učitel</span>
            <span class="user-role">Administrátor</span>
        </div>
        <a th:href="@{/logout}" class="btn-logout" title="Odhlásit se" onclick="sessionStorage.clear();">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </a>
    </div>
</header>

<main class="dashboard-container">

    <!-- Welcome Banner / Quick Stats -->
    <section class="overview-banner">
    </section>

    <!-- Quick Access Action Cards -->
    <section class="tools-grid">
        <div class="tool-card launch-test-card" id="card-launch-test">
            <div class="tool-icon"><i class="fa-solid fa-file-circle-plus"></i></div>
            <div class="tool-info">
                <h3>Vytvořit nový test</h3>
                <p>Sestavte vícevariantní testy ze schválených otázek.</p>
            </div>
            <button type="button" class="btn-tool-action open-new-test-btn">Nový test</button>
        </div>

        <a th:href="@{/question_maker}" class="tool-card link-card">
            <div class="tool-icon q-icon"><i class="fa-solid fa-pen-ruler"></i></div>
            <div class="tool-info">
                <h3>Tvorba otázek</h3>
                <p>Vytvářejte a odesílejte otázky do banky ke schválení.</p>
            </div>
            <span class="btn-tool-action secondary">Otevřít editor</span>
        </a>
    </section>

    <!-- Tests Display Section -->
    <section class="tests-section">
        <div class="section-header">
            <div>
                <h2>Testy a návrhy</h2>
                <p class="section-subtitle">Nedávné testy a rozpracované návrhy.</p>
            </div>
            <button type="button" class="btn-primary-add open-new-test-btn" id="btn-open-new-test">
                <i class="fa-solid fa-plus"></i>
                <span>Nový test</span>
            </button>
        </div>

        <!-- Test Cards Grid -->
        <div class="tests-grid">
        </div>
    </section>

</main>

<!-- Modal: Show questions from subject -->
<dialog class="modal-dialog" id="show-questions">
    <h1 class="subject-name">Předmět</h1>
    <div class="categories"></div>
    <div class="question-display"></div>
</dialog>

<!-- Modal: New Test Creation Popup -->
<dialog class="modal-dialog" id="new-test-dialog">
    <div class="dialog-box">
        <div class="dialog-header">
            <h3>Vytvořit nový test</h3>
            <button type="button" class="btn-close-modal" id="btn-close-dialog">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form id="form-new-test" method="dialog">
            <div class="form-group">
                <label for="new-test-title">Název testu</label>
                <input type="text" id="new-test-title" placeholder="např. Závěrečný test z operačních systémů" required>
            </div>

            <div class="form-group">
                <label for="new-test-subject">Předmět</label>
                <select id="new-test-subject" required>
                    <option value="" disabled selected>Vyberte předmět...</option>
                    <option th:each="sub : ${subjects}" th:value="${sub.subjectID}" th:text="${sub.subjectName}">Předmět</option>
                    <option th:if="${#lists.isEmpty(subjects)}" value="1">Matematika</option>
                    <option th:if="${#lists.isEmpty(subjects)}" value="2">Operační systémy</option>
                    <option th:if="${#lists.isEmpty(subjects)}" value="3">Počítačové sítě</option>
                    <option th:if="${#lists.isEmpty(subjects)}" value="4">Programování v Javě</option>
                </select>
            </div>

            <div class="dialog-actions">
                <button type="button" class="btn-modal-cancel" id="btn-cancel-dialog">Zrušit</button>
                <button type="submit" class="btn-modal-confirm" id="btn-confirm-test">
                    Vytvořit a otevřít <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </form>
    </div>
</dialog>

<script th:src="@{/dist/test_display_manager.js}"></script>
</body>
</html>
