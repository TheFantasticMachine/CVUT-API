<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <link rel="stylesheet" th:href="@{/dist/login.css}">
</head>
<body>

<div class="auth-wrapper" id="auth-container">

    <!-- Sign Up Form Panel (Hidden on left by default) -->
    <div class="form-container sign-up-container">
        <form action="#" th:action="@{/register}" method="POST">
            <h2>Create Account</h2>

            <div class="social-container">
                <a href="#" class="social-btn">f</a>
                <a href="#" class="social-btn">G</a>
                <a href="#" class="social-btn">in</a>
            </div>

            <span class="form-subtitle">or use your email for registration</span>

            <input type="text" name="name" placeholder="Name" required />
            <input type="email" name="email" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />

            <button type="submit" class="btn-solid">Sign Up</button>
        </form>
    </div>

    <!-- Sign In Form Panel (Active on left by default) -->
    <div class="form-container sign-in-container">
        <form action="#" th:action="@{/login}" method="POST">
            <h2>Sign In</h2>

            <div class="social-container">
                <a href="#" class="social-btn">f</a>
                <a href="#" class="social-btn">G</a>
                <a href="#" class="social-btn">in</a>
            </div>

            <span class="form-subtitle">or use your account</span>

            <input type="email" name="username" placeholder="Email" required />
            <input type="password" name="password" placeholder="Password" required />

            <a href="#" class="forgot-link">Forgot your password?</a>
            <button type="submit" class="btn-solid">Sign In</button>
        </form>
    </div>

    <!-- Sliding Red Overlay Cover -->
    <div class="overlay-container">
        <div class="overlay">

            <!-- Left Side Cover (Shown when Sign-Up is open) -->
            <div class="overlay-panel overlay-left">
                <h2>Welcome Back!</h2>
                <p>Enter your personal details to use all of site features</p>
                <button type="button" class="btn-ghost" id="signIn">Sign In</button>
            </div>

            <!-- Right Side Cover (Shown when Sign-In is open) -->
            <div class="overlay-panel overlay-right">
                <h2>Hello, Friend!</h2>
                <p>Register with your personal details to use all of site features</p>
                <button type="button" class="btn-ghost" id="signUp">Sign Up</button>
            </div>

        </div>
    </div>

</div>

<script>
    const container = document.getElementById('auth-container');
    const signUpBtn = document.getElementById('signUp');
    const signInBtn = document.getElementById('signIn');

    signUpBtn.addEventListener('click', () => {
        container.classList.add('right-panel-active');
    });

    signInBtn.addEventListener('click', () => {
        container.classList.remove('right-panel-active');
    });
</script>

</body>
</html>
