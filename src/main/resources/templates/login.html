<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení - Generátor testů</title>
    <link rel="stylesheet" th:href="@{/dist/login.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">
<div class="auth-wrapper">
    <!-- Brand Header -->
    <header class="auth-header">
        <div class="brand-badge">
<!--            <i class="fa-solid fa-graduation-cap"></i>-->
            <img  th:src="@{/dist/icon.png}" class="brand-icon" alt="logo">
        </div>
        <h1>TestGen</h1>
        <p class="auth-subtitle">Tvorba testů a banka otázek pro učitele</p>
    </header>

    <!-- Main Auth Card -->
    <div class="auth-card">
        <!-- Segmented Switcher Tabs -->
        <div class="auth-tabs" role="tablist">
            <button type="button" class="tab-btn active" id="tab-login" role="tab">Přihlášení</button>
            <button type="button" class="tab-btn" id="tab-register" role="tab">Registrace</button>
        </div>

        <!-- Error Banner -->
        <div id="auth-error" class="auth-banner error" style="display: none;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="auth-error-text"></span>
        </div>

        <!-- Auth Form -->
        <form id="auth-form" novalidate>
            <div class="input-group">
                <label for="username">Uživatelské jméno</label>
                <div class="input-field">
                    <i class="fa-regular fa-user field-icon"></i>
                    <input type="text" id="username" name="username" placeholder="např. ucitel_novak" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label for="password">Heslo</label>
                <div class="input-field">
                    <i class="fa-solid fa-lock field-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Zadejte heslo" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="btn-submit-auth" class="btn-auth-submit">
                <span>Přihlásit se</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

    <footer class="auth-footer">
        <span>Zabezpečený akademický portál</span> &bull; <span>v2.0 Alpha</span>
    </footer>
</div>

<script th:src="@{/dist/user_auth.js}"></script>
</body>
</html>
