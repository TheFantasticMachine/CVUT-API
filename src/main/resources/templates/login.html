<body>

<div class="auth-card">
    <!-- Toggle Tabs -->
    <div class="auth-tabs">
        <button type="button" class="tab-btn active" id="tab-login">Login</button>
        <button type="button" class="tab-btn" id="tab-register">Register</button>
    </div>

    <!-- Error Banner -->
    <div id="auth-error" class="error-banner" style="display: none; color: #ef4444; margin-bottom: 1rem; font-size: 0.85rem;"></div>

    <form id="auth-form">
        <div class="form-group">
            <input type="text" id="username" placeholder="Username" required autocomplete="username">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="submit" id="btn-submit-auth" class="btn-primary">Sign In</button>
    </form>
</div>
