<!DOCTYPE html>
<html lang="cs" xmlns:th="http://www.thymeleaf.org">
<head>
<!--    <link rel="stylesheet" th:href="@{dist/pdf-template.css}">-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">

    <style>
        @page {
            size: A4;
            margin: 15mm;
        }
        span {
            font-family: "Poppins", sans-serif;
            font-weight: 500;
            font-style: normal;
        }

        body header {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            row-gap: 5px;
        }
        body header hr {
            width: 100%;
        }
        body header .header-test-variant {
            font-size: 25px;
        }
        body header .header-row-one {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: start;
            column-gap: 5px;
            width: 100%;
        }
        body header .header-row-one .header-test-subject {
            flex-grow: 3;
            font-size: 20px;
        }
        body header .header-row-one .header-test-date {
            flex-grow: 1;
            font-size: 18px;
        }
        body header .header-name {
            font-size: 18px;
            align-self: start;
        }
        body .questions {
            font-family: "Poppins", sans-serif;
            display: flex;
            align-items: start;
        }
        body .questions .question-wrapper {
            display: flex;
            flex-direction: column;
            row-gap: 5px;
        }
        body .questions .question-wrapper .flex-row-one {
            width: inherit;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: start;
            column-gap: 5px;
        }
        body .questions .question-wrapper .flex-row-one .question-number::after {
            content: ")";
        }
        body .questions .question-wrapper .flex-row-two {
            display: flex;
            flex-direction: row;
            justify-content: start;
            align-items: start;
            column-gap: 5px;
        }
    </style>
</head>
<body>


<header>
    <span class="header-test-variant" th:text="${variant}"></span>
    <hr>
    <div class="header-row-one">
        <span class="header-test-subject">Subject: <span th:text="${subject}"></span></span>
        <span class="header-test-date">Date: </span>
    </div>
    <span class="header-name">Name: </span>
    <hr>
</header>


<div class="questions"  th:each="question, questionData : ${questions}"  >
    <div class="question-wrapper">
<!-- First row ... space for the question assignment and the number of the question -->
        <div class="flex-row-one">
            <span class="question-number" th:text="${questionData.index + 1}"></span>
            <span class="question-assignment" th:text="${question.assignment}"></span>
        </div>


<!-- Second row ... space for answer and the answers themselves -->
        <div class="flex-row-two">
            <div class="answer">
                <span>Answer: </span>
            </div>
            <!-- Answers layout -->
            <div class="answers-grid" style="margin-left: 12pt;">
                <div th:each="ans, ansIter : ${question.answers}" class="answer-line" style="margin-bottom: 2pt;">
                    <span th:text="${#strings.substring('ABCDEFGHIJ', ansIter.index, ansIter.index + 1)} + ') '">A) </span>
                    <span th:text="${ans.answerText}">Option text</span>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
